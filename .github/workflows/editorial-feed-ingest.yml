name: CIE Daily feed ingest
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cie-editorial-feed-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and submit recent publisher stories
        env:
          EDITORIAL_INGEST_SECRET: ${{ secrets.EDITORIAL_INGEST_SECRET }}
          DRY_RUN: "false"
        run: node scripts/editorial-feed-ingest.mjs
